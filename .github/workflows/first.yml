#name of the file
name: QA Automation
#When to execute 
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
#Jobs to execute 
jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
     # Step 1: Get the GitHub repository code
      - name: Checkout Code
        uses: actions/checkout@v4
        # Step 2: Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Execute Pytest
      - name: Run Pytest
        run: pytest -v tests